<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
</head>
<body>
    <div class="container">
        <h1>Receipt Scanner</h1>

        <div id="scan-section">
            <button id="capture-btn">📷 Scan Receipt</button>
            <input type="file" id="file-input" accept="image/*" capture="camera" style="display:none">
        </div>

        <div id="processing-msg" style="display:none">Processing OCR...</div>

        <div id="edit-form" style="display:none">
            <h2>Confirm Details</h2>
            <div class="form-group">
                <label>Vendor:</label>
                <input type="text" id="vendor">
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="text" id="date">
            </div>
            <div class="form-group">
                <label>Amount (excl. VAT):</label>
                <input type="number" step="0.01" id="amount">
            </div>
            <div class="form-group">
                <label>VAT:</label>
                <input type="number" step="0.01" id="vat">
            </div>
            <div class="form-group">
                <label>Total:</label>
                <input type="number" step="0.01" id="total">
            </div>
            <div class="form-group">
                <label>Category:</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Supplies">Supplies</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Miscellaneous">Miscellaneous</option>
                </select>
            </div>
            <div class="button-group">
                <button id="save-btn">Save</button>
                <button id="cancel-btn">Cancel</button>
            </div>
        </div>

        <div id="history-section">
            <h2>Recent Receipts</h2>
            <div id="receipt-list"></div>
            <button id="export-btn">📊 Export to Excel</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
