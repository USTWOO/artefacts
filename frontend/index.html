<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
</head>
<body>
    <div class="mobile-only-overlay">
        <p>This app is optimized for mobile only.</p>
    </div>

    <div class="container">
        <header>
            <h1>Receipt Scanner</h1>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="scan">Scan</button>
            <button class="tab-btn" data-tab="history">History</button>
            <button class="tab-btn" data-tab="stats">Stats</button>
        </nav>

        <main>
            <!-- Scan View -->
            <section id="scan-view" class="view">
                <div id="scan-section">
                    <button id="capture-btn">📷 Scan Receipt</button>
                    <input type="file" id="file-input" accept="image/*" capture="camera" style="display:none">
                </div>

                <div id="processing-msg" style="display:none">Processing OCR...</div>

                <div id="edit-form" style="display:none">
                    <h2>Confirm Details</h2>
                    <div id="scanned-image-preview"></div>
                    <div class="form-group">
                        <label>Company Name:</label>
                        <input type="text" id="vendor">
                    </div>
                    <div class="form-group">
                        <label>Receipt Date:</label>
                        <input type="text" id="date">
                    </div>
                    <div class="form-group">
                        <label>SubTotal:</label>
                        <input type="number" step="0.01" id="subtotal">
                    </div>
                    <div class="form-group">
                        <label>VAT:</label>
                        <input type="number" step="0.01" id="vat">
                    </div>
                    <div class="form-group">
                        <label>Total:</label>
                        <input type="number" step="0.01" id="total">
                    </div>
                    <div class="form-group">
                        <label>Category:</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Fuel">Fuel</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Supplies">Supplies</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Miscellaneous">Miscellaneous</option>
                        </select>
                    </div>
                    <div class="button-group">
                        <button id="save-btn">Save</button>
                        <button id="cancel-btn">Cancel</button>
                    </div>
                </div>
            </section>

            <!-- History View -->
            <section id="history-view" class="view" style="display:none">
                <h2>All Receipts</h2>
                <div id="receipt-list"></div>
                <button id="export-btn">📊 Export to Excel</button>
            </section>

            <!-- Stats View -->
            <section id="stats-view" class="view" style="display:none">
                <h2>Expenses Summary</h2>

                <div class="stats-card">
                    <h3>By Month</h3>
                    <div id="monthly-stats-list"></div>
                </div>

                <div class="stats-card">
                    <h3>By Category</h3>
                    <div id="category-stats-list"></div>
                </div>
            </section>
        </main>

        <footer>
            <button id="pc-sync-btn" disabled>🔗 Sync to PC (Disabled)</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
